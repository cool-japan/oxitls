# oxitls-rustcrypto-provider: in-oxitls fork of rustls-rustcrypto 0.0.2-alpha
# carrying the RUSTSEC-2026-0104 fix (rustls-webpki 0.102.x CRL-parsing panic).
# The `webpki`/`rustls-webpki` dependency is REMOVED; algorithm identifiers are
# routed through rustls-pki-types instead. Dependency versions below mirror the
# proven patched fork exactly — do NOT re-add webpki and do NOT lift these to
# workspace deps where versions would drift (e.g. p256/p384 0.13 vs 0.14-rc).
[package]
name = "oxitls-rustcrypto-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors = ["RustCrypto Developers", "COOLJAPAN OU (Team Kitasan)"]
license = "MIT OR Apache-2.0"
description = "Pure-Rust RustCrypto rustls CryptoProvider with the RUSTSEC-2026-0104 fix (rustls-webpki CRL-panic): webpki dependency removed, algorithm identifiers routed through rustls-pki-types."
readme = "README.md"
categories = ["cryptography", "no-std"]
keywords = ["rustls", "tls", "rustcrypto", "pure-rust", "cooljapan"]

[dependencies]
aead = { version = "0.5.2", default-features = false }
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
chacha20 = { version = "0.9", default-features = false }
chacha20poly1305 = { version = "0.10.1", default-features = false }
crypto-common = { version = "0.1.6", default-features = false }
der = { version = "0.7.9", default-features = false }
digest = { version = "0.10.7", default-features = false }
ecdsa = { version = "0.16.8", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2", default-features = false, features = ["pkcs8"] }
hmac = { version = "0.12.1", default-features = false }
p256 = { version = "0.13.2", default-features = false, features = ["pem", "ecdsa", "ecdh"] }
p384 = { version = "0.13.0", default-features = false, features = ["pem", "ecdsa", "ecdh"] }
paste = { version = "1.0.14", default-features = false }
pkcs8 = { version = "0.10.2", default-features = false, features = ["pem", "pkcs5"] }
pki-types = { package = "rustls-pki-types", version = "1.0.1", default-features = false }
rand_core = { version = "0.6.4", default-features = false, features = ["getrandom"] }
rsa = { version = "0.9.2", default-features = false, features = ["sha2"] }
rustls = { version = "0.23.0", default-features = false }
sec1 = { version = "0.7.3", default-features = false, features = ["pkcs8", "pem"] }
sha2 = { version = "0.10.7", default-features = false }
signature = { version = "2.1.0", default-features = false }
x25519-dalek = { version = "2", default-features = false }

[features]
default = ["std", "tls12", "zeroize"]
logging = ["rustls/logging"]
tls12 = ["rustls/tls12"]
std = ["alloc", "pki-types/std", "rustls/std", "ed25519-dalek/std"]
alloc = ["pki-types/alloc", "aead/alloc", "ed25519-dalek/alloc"]
zeroize = ["ed25519-dalek/zeroize", "x25519-dalek/zeroize"]
