[package]
name = "oxitls-native-certs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OxiTLS OS-native certificate-store adapter (Security.framework / SChannel FFI, opt-in quarantine crate)"
readme = "README.md"
categories = ["cryptography", "network-programming"]
keywords = ["tls", "rustls", "native-certs", "cooljapan", "oxitls"]

[dependencies]
oxitls-core = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
rustls-pemfile = { workspace = true }
tokio = { workspace = true }

# Platform-FFI deps are target-cfg-gated so a Linux (or any non-macOS,
# non-Windows) consumer never compiles the macOS/Windows shims it cannot use.
# This crate remains the impure-by-design "quarantine crate" per its own doc
# comment (src/lib.rs) -- callers opt into FFI by depending on it directly --
# but within that opt-in, each platform now only builds its own FFI surface.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
schannel = { workspace = true }
