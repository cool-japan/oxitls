[workspace]
resolver = "2"
members = [
    "crates/oxitls-core",
    "crates/oxitls-adapter-rustls-rustcrypto",
    "crates/oxitls-rustcrypto-provider",
    "crates/oxitls-adapter-aws-lc",
    "crates/oxitls-adapter-pkcs11",
    "crates/oxitls-webpki-roots",
    "crates/oxitls-native-certs",
    "crates/oxitls",
    "crates/oxitls-h2",
    "crates/oxitls-rcgen",
    "crates/oxitls-bench",
]
exclude = [
    "crates/oxitls-adapter-rustls-rustcrypto/fuzz",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
authors = ["COOLJAPAN OU (Team Kitasan)"]
license = "Apache-2.0"
repository = "https://github.com/cool-japan/oxitls"
description = "OxiTLS is the COOLJAPAN-blessed Pure Rust TLS transport stack."

[workspace.dependencies]
# crates in this workspace
oxitls-core = { path = "crates/oxitls-core", version = "0.3.0" }
oxitls-adapter-rustls-rustcrypto = { path = "crates/oxitls-adapter-rustls-rustcrypto", version = "0.3.0" }
oxitls-adapter-aws-lc = { path = "crates/oxitls-adapter-aws-lc", version = "0.3.0" }
oxitls-adapter-pkcs11 = { path = "crates/oxitls-adapter-pkcs11", version = "0.3.0" }
oxitls-webpki-roots = { path = "crates/oxitls-webpki-roots", version = "0.3.0" }
oxitls-native-certs = { path = "crates/oxitls-native-certs", version = "0.3.0" }
oxitls = { path = "crates/oxitls", version = "0.3.0" }
oxitls-h2 = { path = "crates/oxitls-h2", version = "0.3.0" }
oxitls-rcgen = { path = "crates/oxitls-rcgen", version = "0.3.0" }
# external -- default-features = false on rustls/tokio-rustls avoids the aws_lc_rs default
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-pemfile = { version = "2.2" }
# rustls-rustcrypto now resolves to the in-oxitls CVE-fixed fork
# (oxitls-rustcrypto-provider): rustls-webpki dependency removed
# (RUSTSEC-2026-0104 CRL-parsing panic), alg ids routed through rustls-pki-types.
# Package-rename keeps the `rustls_rustcrypto` extern name; no [patch] needed.
# Uses std+tls12+zeroize by default; do NOT override default-features.
rustls-rustcrypto = { package = "oxitls-rustcrypto-provider", version = "0.3.0", path = "crates/oxitls-rustcrypto-provider" }
rustls-pki-types = { version = "1" }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
webpki-roots = { version = "1" }
tokio = { version = "1", features = ["full"] }
# rcgen: default-features=false keeps ring/aws-lc-rs off the normal edge.
# Tests that need KeyPair::generate must add features = ["crypto","pem","ring"] per crate.
rcgen = { version = "0.14", default-features = false, features = ["pem"] }
# h2: HTTP/2 implementation (pure Rust)
# `unstable` exposes num_active_streams / num_wired_streams on SendRequest.
h2 = { version = "0.4.15", features = ["unstable"] }
# bytes: shared buffer type used by h2
bytes = { version = "1" }
# http: HTTP types (shared with h2)
http = { version = "1" }
# hyper + hyper-util: HTTP/1.1 client/server (used by integration tests)
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio"] }
http-body-util = { version = "0.1" }
# Crypto primitives used by oxitls-rcgen for key generation + PKCS#8 export
# (must stay separate from the oxicrypto workspace — no cross-workspace path dep here)
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["rand_core", "pkcs8", "alloc"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "ecdh", "alloc", "pkcs8"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdsa", "alloc", "pkcs8"] }
# RSA: Pure Rust. `sha2` enables the SHA-256 prefix used by PKCS#1 v1.5; `std` provides
# the Error trait; `pem` adds PEM encoding. pkcs8 is not a feature (it's a transitive
# crate); EncodePrivateKey/EncodePublicKey are always exposed at rsa::pkcs8::*.
rsa = { version = "0.9", default-features = false, features = ["sha2", "std", "pem"] }
# rand/rand_core are kept CURRENT at 0.10. The crypto crates (`rsa` 0.9,
# `ed25519-dalek` 2.x, `x25519-dalek` 2.x) bind to the *rand_core 0.6* traits,
# which rand_core 0.10 no longer provides, so they are fed a getrandom-backed
# rand_core-0.6 `OsRng` adapter defined in `oxitls-core` (see `os_rng.rs`).
# `rand` here is used only for non-crypto randomness (e.g. bench inputs).
# rand_core 0.10 is NOT declared as a direct workspace dep: rand 0.10 pulls it
# transitively, and no crate uses the 0.10 traits directly anymore.
rand = { version = "0.10", default-features = false, features = ["std", "std_rng", "thread_rng"] }
# rand_core 0.6 (a DIFFERENT major from the `rand`/`rand_core` 0.10 above):
# feeds the getrandom-backed `oxitls_core::OsRng` adapter (src/os_rng.rs),
# which implements the *0.6* traits that `rsa` 0.9 / `ed25519-dalek` 2.x /
# `x25519-dalek` 2.x still require. Both majors coexist in one Cargo.lock,
# same pattern as the `sha2` 0.11/0.10.7 split above.
rand_core = { version = "0.6", default-features = false }
getrandom = { version = "0.4.3", features = ["std"] }
# p12: Pure Rust PKCS#12 (PFX) export — uses 3DES/PBE via the `des` crate.
p12 = { version = "0.6" }
# sha2 v0.11: shared by every crate that needs SHA-256 at the *current* major
# (matches p256/ed25519-dalek family: SKI/fingerprint computation, anti-replay
# ticket hashing, OCSP/rsa "oid"-prefixed PKCS#1 v1.5 digests). Features are the
# union actually used workspace-wide (alloc, oid) -- which is sha2's own default
# set, so this is behavior-neutral for every existing call site.
# NOTE: oxitls-rustcrypto-provider pins sha2 0.10.7 directly (NOT this entry) --
# that vendored fork is intentionally held on the older major so its diff against
# upstream rustls-rustcrypto 0.0.2-alpha stays minimal; the two majors coexist
# fine in one Cargo.lock (Cargo resolves them as unrelated dependency edges).
sha2 = { version = "0.11", default-features = false, features = ["alloc", "oid"] }
# AES-256-GCM for OxiTicketer (no ring)
aes-gcm = { version = "0.11.0", default-features = false, features = ["aes", "alloc"] }
# oxiarc-deflate: pure-Rust RFC 1950 zlib / RFC 1951 DEFLATE — cert compression (RFC 8879)
oxiarc-deflate = { version = "0.4.1", default-features = false }
hkdf = { version = "0.13", default-features = false }
# ChaCha20-Poly1305 (pure Rust, no ring) — used by bench crate AEAD comparison
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
# criterion: benchmark harness (bench-crate only)
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }
# cryptoki: PKCS#11 bindings (optional — only pulled in by oxitls-adapter-pkcs11/pkcs11 feature)
cryptoki = { version = "0.12.0" }
# LRU cache (pure Rust) — used by oxitls-webpki-roots intermediate cert cache
lru = { version = "0.18" }
# ml-kem: Pure Rust ML-KEM post-quantum KEM (FIPS 203)
ml-kem = { version = "0.3.2", default-features = false, features = ["alloc", "getrandom"] }
# X.509 parser — used by oxitls-webpki-roots for expiration parsing and by oxitls-rcgen accessors
x509-parser = { version = "0.18" }
# x25519-dalek: Pure Rust X25519 DH — post-quantum hybrid KEX
x25519-dalek = { version = "2", default-features = false, features = ["alloc", "static_secrets"] }
# time crate (pure Rust) — used for expiration comparisons; "formatting" feature for Display impls
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing"] }
# Platform native cert stores — consumed by the oxitls-native-certs quarantine crate (no longer feature-gated)
security-framework = { version = "3" }
# signature: RustCrypto signature traits — needed for OCSP/SCT cryptographic verification
signature = { version = "3", default-features = false, features = ["alloc"] }
schannel = { version = "0.1" }
# futures: async utilities used by oxitls-h2
futures = { version = "0.3" }
# aws-lc-rs: C/FFI crypto (feature-gated; never in default closure)
aws-lc-rs = { version = "1.17.1" }
# OCSP + DER parsing (Pure Rust, RustCrypto formats)
x509-ocsp = { version = "0.2", features = ["std"] }
x509-cert = { version = "0.2", features = ["std", "pem"] }
der = { version = "0.8", features = ["alloc", "oid"] }
spki = { version = "0.8", features = ["alloc"] }
# Tracing log facade (zero-cost when no subscriber)
tracing = { version = "0.1" }
# secrecy: wrapper types for secret management (PIN, passwords)
secrecy = { version = "0.10.3" }
# parking_lot: compact and efficient synchronization primitives
parking_lot = { version = "0.12.5" }
# dhat: heap profiler (feature-gated; used by oxitls-webpki-roots and oxitls-bench)
dhat = { version = "0.3" }
# ring: C/FFI crypto (bench comparison only — never on normal dep edge; feature-gated)
ring = { version = "0.17" }
# SHA-1 is required to recompute OCSP CertID issuer hashes: RFC 6960 responders
# overwhelmingly use id-sha1 as the CertID hashAlgorithm. Pure Rust (RustCrypto).
sha1 = { version = "0.10", features = ["oid"] }
# oxihttp: COOLJAPAN HTTP client/server (bench dev-dep only)
oxihttp = { version = "0.2.0", default-features = false }
# oxicrypto cross-workspace published crates (dev-dep in oxitls-adapter-aws-lc wave8 test)
oxicrypto-adapter-aws-lc = { version = "0.3.0" }
oxicrypto-core = { version = "0.3.0" }
